<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;0,900;1,500&family=Patrick+Hand&display=swap">
<style>html,body{margin:0;background:#000}#stage{width:1920px;height:1080px;overflow:hidden}svg{display:block}</style>
</head><body><div id="stage"></div>
<script type="module">
import { SCENES } from './scenes.js';
const q = new URLSearchParams(location.search);
const name = q.get('scene'), t = parseFloat(q.get('t') || '0');
await document.fonts.load('92px Bangers'); await document.fonts.load('800 40px Rubik'); await document.fonts.load('40px "Patrick Hand"');
const svg = SCENES[name](t);
document.getElementById('stage').innerHTML = svg;
window.__ready = true;
</script></body></html>
