<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:ital,wght@0,500;0,700;0,800;0,900;1,500&family=Patrick+Hand&display=swap">
<style>html,body{margin:0;background:transparent}#stage{overflow:hidden}svg{display:block}</style>
</head><body><div id="stage"></div>
<script type="module">
await document.fonts.load('92px Bangers'); await document.fonts.load('800 40px Rubik'); await document.fonts.load('italic 500 40px Rubik'); await document.fonts.load('40px "Patrick Hand"');
const stage = document.getElementById('stage');
// draw one layer at its own box so it can be screenshotted with a transparent background
window.paint = (defs, svg, b) => {
  stage.style.width = b.w + 'px'; stage.style.height = b.h + 'px';
  stage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y} ${b.w} ${b.h}" width="${b.w}" height="${b.h}">${defs}${svg}</svg>`;
  return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
};
window.__ready = true;
</script></body></html>
