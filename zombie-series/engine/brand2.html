<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bowlby+One&family=Lilita+One&family=Luckiest+Guy&family=Titan+One&family=Rubik:ital,wght@0,400;0,500;0,700;0,800;0,900;1,500;1,800&display=swap">
<style>html,body{margin:0;background:#000}#stage{overflow:hidden}svg{display:block}</style>
</head><body><div id="stage"></div>
<script type="module">
// Draw one art module: ?mod=brand/v2/<file>.js whose default export returns { w, h, svg, css? }.
const mod = new URLSearchParams(location.search).get('mod');
for (const f of ['100px "Lilita One"', '100px "Luckiest Guy"', '100px "Titan One"', '100px "Bowlby One"', '100px Anton', '92px Bangers', '900 40px Rubik', '800 40px Rubik', '500 40px Rubik', 'italic 800 40px Rubik']) await document.fonts.load(f);
const { default: make } = await import(`./${mod}`);
const { w, h, svg, css } = await make();
const stage = document.getElementById('stage');
stage.style.width = w + 'px'; stage.style.height = h + 'px';
if (css) stage.style.filter = css;
stage.innerHTML = svg;
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
window.__ready = true;
</script></body></html>
