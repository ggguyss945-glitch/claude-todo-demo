<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Lilita+One&display=block">
<style>html,body{margin:0;background:#000}#stage{overflow:hidden;position:relative}svg{display:block}</style>
</head><body><div id="stage"></div>
<script type="module">
// Draw one still: ?mod=<file>.js (relative to engine/) whose default export returns { w, h, svg }.
const qs = new URLSearchParams(location.search);
const mod = qs.get('mod'), arg = qs.get('arg');
const want = ['900 60px Nunito', '800 60px Nunito', '700 60px Nunito', '600 60px Nunito', '60px "Lilita One"'];
for (const f of want) { try { await document.fonts.load(f); } catch (e) {} }
window.__fonts = want.filter((f) => ![...document.fonts].some((ff) => ff.status === 'loaded' && f.includes(ff.family.replace(/"/g, ''))));
window.addEventListener('error', (e) => { window.__err = String(e.message); window.__ready = true; });
let made;
try { const { default: make } = await import(`./${mod}`); made = await make(arg); }
catch (e) { window.__err = String(e && e.stack || e); window.__ready = true; throw e; }
const { w, h, svg } = made;
const stage = document.getElementById('stage');
stage.style.width = w + 'px'; stage.style.height = h + 'px';
stage.innerHTML = svg;
await document.fonts.ready;
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
window.__ready = true;
</script></body></html>
